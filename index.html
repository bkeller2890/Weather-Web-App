<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <!-- Added Severe Weather Alert Banner -->
        <div class="severe-alert-banner" style="display: none;" role="alert" aria-live="assertive">
        </div>

        <!-- One Call failure toast (hidden by default) -->
        <div class="onecall-toast" id="onecall-toast" role="alert" aria-live="polite" style="display:none;">
            <span class="onecall-msg">Detailed daily data unavailable.</span>
            <div class="onecall-actions">
                <button id="onecall-retry" class="onecall-btn">Retry</button>
                <button id="onecall-close" class="onecall-btn close">✕</button>
            </div>
        </div>

        <!-- Runtime API key override for testing (small, reversible) -->
        <div id="key-override" class="key-override" aria-hidden="false">
            <input id="owm-key-input" class="owm-key-input" placeholder="Paste OpenWeather API key" aria-label="OpenWeatherMap API key" />
            <button id="owm-key-save" class="btn small">Save</button>
            <button id="owm-key-clear" class="btn small ghost">Clear</button>
            <span id="owm-key-indicator" class="key-indicator" aria-hidden="true"></span>
        </div>


        <div class="search">
          <input type="text" id="city-input" placeholder="Enter city, State, or Zip" spellcheck="false">
            <button aria-label="Use current location" data-location-btn class="location-btn">
                <img src="images/location.png" alt="Current Location icon"> 
            </button>
            <button aria-label="Search for weather" data-search-btn class="search-btn">
                <img src="images/search.png" alt="Search icon">
            </button>
        </div>

        <div class="saved-cities-container">   

        </div>
        
        <div class="weather" role="region" aria-label="Current Weather Details">

            <!-- Layout toggle: enhanced icon + tooltip -->
            <div class="layout-controls" style="position: absolute; top: 18px; right: 24px;">
                <button id="layout-toggle" class="layout-toggle" aria-pressed="false" aria-label="Toggle layout" title="Toggle layout">
                    <span class="lt-icon" aria-hidden="true">🗂️</span>
                    <span class="lt-tooltip">Toggle Cards/Stack</span>
                </button>
            </div>
            
            <div class="current-weather-main">
                <img src="images/clear.png" class="weather-icon" data-weather-icon alt="Current weather condition icon">
                
                <h1 class="temp" data-temp>--&deg;F</h1> 
                <h2 class="city" data-city>City Name</h2>
                
                </div>
            
            <div class="details" data-details-full-width>
                <figure class="col">
                    <img src="images/humidity.png" alt="Droplet icon for humidity">
                    <figcaption>
                        <p class="humidity" data-humidity>--%</p>
                        <p>Humidity</p>
                    </figcaption>
                </figure>
                
                <figure class="col">
                    <img src="images/wind.png" alt="Wind stream icon">
                    <figcaption>
                        <p class="wind" data-wind>-- mph</p>
                        <p>Wind Speed</p>
                    </figcaption>
                </figure>
            </div>
            <div class="hourly-forecast" role="list" aria-label="Hourly Temperature Forecast">
                <h3>Hourly Forecast</h3>
                    <div class="hourly-scroll-container">
                        <div class="hourly-item">
                            <p class="hour">2 PM</p>
                            <img src="images/clear.png" alt="Sunny icon">
                            <p class="hourly-temp">78&deg;</p>
                        </div>
                    </div>
            </div>

            <!-- Daily forecast moved to appear immediately after hourly as a horizontal scroller -->
            <div class="daily-forecast" role="list" aria-label="7 Day Forecast">
                <h3>7-Day Forecast</h3>
                <div class="daily-fallback" style="display:none;">Detailed daily data unavailable — using fallback.</div>
                <div class="daily-scroll-container">
                    <!-- JS will populate daily items here as horizontal cards -->
                </div>
            </div>

        </div>
        <div class="loading" data-loading-state>Fetching weather data... </div> 
        <div class="error" data-error-msg>Invalid city name or error fetching data.</div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
